<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuentas Navideñas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: una columna, cabecera verde pino, barra inferior de 5 secciones, tarjetas sobre fondo gris verdoso */
  --bg:#f1f5f2; --surface:#ffffff; --ink:#14241b; --muted:#59695f; --line:#d8e1db;
  --pine:#134e33; --on-pine:#ffffff; --red:#b3202f; --on-red:#ffffff; --gold:#c9972c;
  --good:#1b7a47; --good-bg:#dff1e6; --warn:#9a5700; --warn-bg:#fbebcf; --bad:#b3202f; --bad-bg:#f8dcdf; --tint:#e6efe9;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1913; --surface:#16261d; --ink:#e7f0ea; --muted:#9bb0a3; --line:#294034;
    --pine:#0f3a26; --on-pine:#ffffff; --red:#d8414f; --on-red:#ffffff; --gold:#d8a93d;
    --good:#58c58a; --good-bg:#1b3a2a; --warn:#e8ae4f; --warn-bg:#3a2d12; --bad:#ef7480; --bad-bg:#3d1b20; --tint:#1d3327;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-bottom:88px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font:700 1.3rem var(--display)}
h3{font:700 1.05rem var(--body)}
p{margin:0 0 8px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{background:var(--pine);color:var(--on-pine);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--gold)}
.top h1{font:700 1.3rem var(--display)}
.top small{display:block;opacity:.8;font-size:.78rem}
.top .btn{background:transparent;border-color:rgba(255,255,255,.4);color:var(--on-pine)}
main{max-width:720px;margin:0 auto;padding:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{border-left:6px solid var(--red)}
.hero .l,.tile .l{font-size:.8rem;color:var(--muted);font-weight:700}
.big{font:700 2.2rem/1.1 var(--display);font-variant-numeric:tabular-nums;margin:2px 0 6px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font:700 1.2rem var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:.78rem;color:var(--muted)}
.split{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar{height:10px;border-radius:99px;background:var(--tint);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}

.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem;padding:0 14px;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions.end{justify-content:flex-end;margin-top:16px}

.chip{display:inline-block;font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--tint);color:var(--pine);white-space:nowrap}
@media (prefers-color-scheme:dark){.chip{color:var(--ink)}}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.filters{display:flex;gap:8px;margin-bottom:12px}
.filters .btn{min-height:38px}
.filters .btn[aria-pressed=true]{background:var(--pine);color:var(--on-pine);border-color:var(--pine)}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0}
.kv dt{font-size:.75rem;color:var(--muted);font-weight:700}
.kv dd{margin:0;font:700 1.05rem var(--display);font-variant-numeric:tabular-nums}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;font-size:.82rem;color:var(--muted)}
.kv3 b{display:block;font:700 1rem var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.pay{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border-radius:99px;padding:2px 4px 2px 10px;font-size:.8rem;margin:2px 4px 2px 0}
.pay button{border:0;background:transparent;cursor:pointer;color:var(--muted);min-width:28px;min-height:28px;font-weight:800}
.warnline{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:.85rem;font-weight:600;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:24px 12px}
ol.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.step{width:100%;text-align:left;display:flex;gap:10px;align-items:center;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 12px;cursor:pointer;font-weight:600}
.step .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:.8rem;color:#fff}
.step.done{color:var(--muted)} .step.done .dot{background:var(--good);border-color:var(--good)}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.list li:first-child{border-top:0}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;min-height:56px;font-size:.7rem;font-weight:700;color:var(--muted);cursor:pointer}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--red)}
nav .n{background:var(--red);color:#fff;border-radius:99px;font-size:.65rem;padding:0 6px;margin-left:3px}

dialog{border:0;border-radius:18px 18px 0 0;padding:0;width:min(560px,100%);max-width:100%;margin:auto auto 0;max-height:92%;overflow:auto;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(5,20,12,.6)}
@media (min-width:640px){dialog{margin:auto;border-radius:18px}}
.sheet{padding:18px}
.sheet h2{margin-bottom:6px}
.sheet h3{margin:16px 0 4px}
label{display:block;font-size:.85rem;font-weight:700;margin:12px 0 4px}
input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}
.err{color:var(--bad);font-weight:700;margin:10px 0 0;min-height:1em}
.itemrow{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;margin-bottom:10px}
.itemrow .sel{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.thumb{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--tint);border:1px solid var(--line)}
.thumb.lg{width:64px;height:64px}
.pname{display:flex;gap:10px;align-items:center;min-width:0}
.dayh::first-letter{text-transform:uppercase}
.photorow{display:flex;gap:12px;align-items:center;margin-top:6px}
.lots{list-style:none;margin:0;padding:0}
.lots li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.totalline{display:flex;justify-content:space-between;font-weight:800;margin-top:6px}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:.9rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font:inherit}
</style>
</head>
<body>
<header class="top">
  <div><h1>Cuentas Navideñas</h1><small id="sv"></small></div>
  <button class="btn sm" data-a="settings" aria-label="Ajustes y respaldo">Ajustes</button>
</header>
<main id="main"></main>
<nav id="nav" aria-label="Secciones"></nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

  S.products.forEach(function(p){
    var bought=p.lots.reduce(function(a,l){return a+l.qty;},0);
    var spend=p.lots.reduce(function(a,l){return a+l.qty*l.unitCost;},0);
    info[p.id]={p:p,bought:bought,spend:spend,direct:0,sold:0,revenue:0};
    totalSpend+=spend;totalBought+=bought;
  });
  var general=0,totalExtras=0,byType={};
  S.expenses.forEach(function(e){
    totalExtras+=e.amount;byType[e.type]=(byType[e.type]||0)+e.amount;
    if(e.productId&&info[e.productId])info[e.productId].direct+=e.amount;else general+=e.amount;
  });
  S.products.forEach(function(p){
    var i=info[p.id];
    var share=S.settings.alloc==='unidad'?(totalBought?i.bought/totalBought:0):(totalSpend?i.spend/totalSpend:0);
    i.extra=i.direct+general*share;
    i.unit=i.bought?(i.spend+i.extra)/i.bought:0;
    i.mk=p.markup!=null?p.markup:S.settings.markup;
    i.suggested=i.unit>0?roundUp(i.unit*(1+i.mk/100),S.settings.round):0;
    i.sell=p.price!=null?p.price:i.suggested;
    i.realMk=(i.unit>0&&i.sell>0)?(i.sell/i.unit-1)*100:null;
  });
  var revenue=0,collected=0;
  S.sales.forEach(function(s){
    s.items.forEach(function(it){var i=info[it.productId];if(i){i.sold+=it.qty;i.revenue+=it.qty*it.price;}revenue+=it.qty*it.price;});
    collected+=salePaid(s);
  });
  var cogs=0,stockUnits=0,stockValue=0;
  S.products.forEach(function(p){
    var i=info[p.id];i.stock=i.bought-i.sold;cogs+=i.sold*i.unit;
    if(i.stock>0){stockUnits+=i.stock;stockValue+=i.stock*i.sell;}
  });
  var totalCost=totalSpend+totalExtras;
  return {info:info,totalSpend:totalSpend,totalExtras:totalExtras,totalCost:totalCost,byType:byType,
    revenue:revenue,collected:collected,due:revenue-collected,cogs:cogs,profitSold:revenue-cogs,
    stockUnits:stockUnits,stockValue:stockValue,projected:revenue+stockValue-totalCost};
}
function debtors(){
  var m=new Map();
  state.sales.forEach(function(s){
    var name=(s.customer||'').trim()||'Sin nombre',k=name.toLowerCase();
    if(!m.has(k))m.set(k,{key:k,name:name,total:0,paid:0,sales:[]});
    var d=m.get(k);d.total+=saleTotal(s);d.paid+=salePaid(s);d.sales.push(s);
  });
  return Array.from(m.values()).map(function(d){d.due=d.total-d.paid;return d;});
}

    (c.totalCost<=0?'Registra tus compras para ver esto.':net>=0?'Ya recuperaste todo lo invertido. Llevas '+money(net)+' de ganancia en la mano.':'Has cobrado '+money(c.collected)+' de '+money(c.totalCost)+' invertidos. Te faltan '+money(-net)+'.')+'</p></section>';

    tile('Stock disponible',c.stockUnits+' u.',money(c.stockValue)+' a precio de venta')+

  '</div>';
  var low=state.products.map(function(p){return c.info[p.id];}).filter(function(i){return i.realMk!=null&&i.realMk<i.mk-0.5;});
  if(low.length){
    h+='<section class="card"><h3>Revisa estos precios</h3><p class="muted small">Ganan menos que tu meta de utilidad.</p><ul class="list">'+low.map(function(i){
      return '<li><span>'+esc(i.p.name)+'</span><span class="neg">'+Math.round(i.realMk)+'% (meta '+i.mk+'%)</span></li>';}).join('')+'</ul></section>';
  }
  var debt=debtors().filter(function(x){return x.due>0;}).sort(function(a,b){return b.due-a.due;}).slice(0,3);
  if(debt.length){

      return '<li><span>'+esc(x.name)+'</span><strong class="neg">'+money(x.due)+'</strong></li>';}).join('')+'</ul></section>';
  }

    '<div class="row2"><div><label for="lq">Cantidad comprada</label><input id="lq" type="number" min="1" inputmode="numeric"></div><div><label for="lc">Costo por unidad</label><input id="lc" inputmode="numeric" placeholder="$"></div></div>'+
    '<label for="lp">¿En qué compra entra?</label><select id="lp">'+purchasesSorted().map(function(u,k){var sel=lastPurchaseId?u.id===lastPurchaseId:k===0;return '<option value="'+u.id+'"'+(sel?' selected':'')+'>'+esc(u.name)+' · '+fdate(u.date)+'</option>';}).join('')+'</select>'+
    '<div class="row2"><div><label for="ldesp">Despacho (opcional)</label><input id="ldesp" inputmode="numeric" placeholder="$ flete / envío"></div><div><label for="lloc">Locomoción (opcional)</label><input id="lloc" inputmode="numeric" placeholder="$ ir a buscarlo"></div></div>'+
    '<p class="hint">Estos gastos se suman al costo de este producto. Si un despacho cubre varios productos, anótalo en la pestaña Gastos.</p>'+
    '<div class="actions"><button type="button" class="btn sm" id="addlot">Agregar compra y gastos</button>'+(p0?'<button type="button" class="btn sm danger" id="delp">Eliminar producto</button>':'')+'</div>',
    function(fd,form){
      var name=String(fd.get('name')||'').trim();if(!name)return 'Escribe el nombre del producto.';
      if(addPending(form)===false)return 'Revisa la cantidad y el costo de la compra.';
      draft.name=name;
      var pr=String(fd.get('price')||'').trim();draft.price=pr===''?null:parseMoney(pr);
      draft.markup=parsePct(fd.get('markup'));
      draft._exp.forEach(function(e){state.expenses.push({id:uid(),type:e.type,amount:e.amount,date:e.date,purchaseId:e.purchaseId,productId:draft.id,note:'Junto a la compra de '+name});});
      delete draft._exp;
      if(p0){var k=state.products.findIndex(function(x){return x.id===p0.id;});state.products[k]=draft;}else state.products.push(draft);
      commit();
    });
  function pendingLot(form){
    var q=parseInt($('#lq',form).value,10),cs=$('#lc',form).value.trim();
    if(!$('#lq',form).value.trim()&&!cs)return null;
    var cost=parseMoney(cs);
    if(!(q>0)||!(cost>=0)||cs==='')return false;
    var pu=purchaseById($('#lp',form).value);if(!pu)return false;
    return {id:uid(),date:pu.date,purchaseId:pu.id,qty:q,unitCost:cost};
  }
  $('#pf',f).onchange=function(e){var file=e.target.files[0];if(!file)return;
    shrinkPhoto(file,function(d){if(!d){$('#err').textContent='No se pudo leer esa foto. Prueba con otra.';return;}
      $('#err').textContent='';draft.photo=d;$('#pprev',f).innerHTML=photoHtml();$('#rmph',f).hidden=false;});};
  $('#rmph',f).onclick=function(){draft.photo=null;$('#pprev',f).innerHTML=photoHtml();this.hidden=true;$('#pf',f).value='';};
  function addPending(form){
    var l=pendingLot(form);if(l===false)return false;
    var pu0=purchaseById($('#lp',form).value),d=pu0?pu0.date:today(),ex=[];lastPurchaseId=pu0?pu0.id:null;
    [['#ldesp','Despacho'],['#lloc','Locomoción']].forEach(function(x){var a=parseMoney($(x[0],form).value);if(a>0)ex.push({type:x[1],amount:a,date:d,purchaseId:pu0?pu0.id:null});});
    if(l)draft.lots.push(l);ex.forEach(function(e){draft._exp.push(e);});
    $('#lq',form).value='';$('#lc',form).value='';$('#ldesp',form).value='';$('#lloc',form).value='';
    return (l||ex.length)?true:null;
  }
  $('#addlot',f).onclick=function(){
    var r=addPending(f);
    if(r===false||r===null){$('#err').textContent='Escribe la cantidad y el costo por unidad, o el despacho / la locomoción.';return;}
    $('#err').textContent='';$('#lots',f).innerHTML=lotsHtml();
  };
  $('#lots',f).onclick=function(e){var b=e.target.closest('[data-rmlot]'),x=e.target.closest('[data-rmexp]');
    if(b)draft.lots.splice(Number(b.dataset.rmlot),1);else if(x)draft._exp.splice(Number(x.dataset.rmexp),1);else return;$('#lots',f).innerHTML=lotsHtml();};
  var del=$('#delp',f);
  if(del)del.onclick=function(){
    if(state.sales.some(function(s){return s.items.some(function(i){return i.productId===p0.id;});})){$('#err').textContent='No se puede eliminar: tiene ventas registradas.';return;}
    ask('Se eliminará «'+esc(p0.name)+'» y sus compras.','Eliminar',function(){
      state.products=state.products.filter(function(x){return x.id!==p0.id;});
      state.expenses.forEach(function(e){if(e.productId===p0.id)e.productId=null;});commit();});
  };
}

function purchaseDialog(id){
  var u0=id?purchaseById(id):null;
  var f=openDlg(u0?'Editar compra':'Nueva compra',
    '<label for="un">Nombre</label><input id="un" name="name" autocomplete="off" value="'+esc(u0?u0.name:'Compra '+(state.purchases.length+1))+'">'+
    '<label for="ud">Fecha de la compra</label><input id="ud" name="date" type="date" value="'+(u0?u0.date:today())+'">'+
    (u0?'<div class="actions"><button type="button" class="btn sm danger" id="delu">Eliminar compra</button></div>':''),
    function(fd){
      var name=String(fd.get('name')||'').trim();if(!name)return 'Escribe un nombre para la compra.';
      var date=fd.get('date')||today();
      if(u0){u0.name=name;u0.date=date;
        state.products.forEach(function(p){p.lots.forEach(function(l){if(l.purchaseId===u0.id)l.date=date;});});
        state.expenses.forEach(function(e){if(e.purchaseId===u0.id)e.date=date;});}
      else{var n={id:uid(),name:name,date:date};state.purchases.push(n);lastPurchaseId=n.id;}
      commit();
    });
  var d=$('#delu',f);
  if(d)d.onclick=function(){
    var used=state.products.some(function(p){return p.lots.some(function(l){return l.purchaseId===u0.id;});})||state.expenses.some(function(e){return e.purchaseId===u0.id;});
    if(used){$('#err').textContent='Esta compra tiene productos o gastos. Quítalos primero.';return;}
    ask('Se eliminará «'+esc(u0.name)+'».','Eliminar',function(){state.purchases=state.purchases.filter(function(x){return x.id!==u0.id;});commit();});
  };
}

function expenseDialog(id){
  var e0=id?state.expenses.find(function(x){return x.id===id;}):null;
  var opts='<option value="">Todos los productos (se reparte)</option>'+state.products.map(function(p){return '<option value="'+p.id+'"'+(e0&&e0.productId===p.id?' selected':'')+'>Solo: '+esc(p.name)+'</option>';}).join('');
  openDlg(e0?'Editar gasto':'Nuevo gasto',
    '<label for="et">Tipo de gasto</label><select id="et" name="type">'+TYPES.map(function(t){return '<option'+(e0&&e0.type===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select>'+
    '<div class="row2"><div><label for="ea">Monto</label><input id="ea" name="amount" inputmode="numeric" placeholder="$" value="'+(e0?e0.amount:'')+'"></div><div><label for="ed">Fecha</label><input id="ed" name="date" type="date" value="'+(e0?e0.date:today())+'"></div></div>'+
    '<label for="ep">¿A qué producto corresponde?</label><select id="ep" name="product">'+opts+'</select>'+
    '<label for="eu">Compra (opcional)</label><select id="eu" name="purchase"><option value="">Ninguna</option>'+purchasesSorted().map(function(u){return '<option value="'+u.id+'"'+(e0&&e0.purchaseId===u.id?' selected':'')+'>'+esc(u.name)+' · '+fdate(u.date)+'</option>';}).join('')+'</select><p class="hint">Si eliges una compra, el gasto toma la fecha de esa compra.</p>'+
    '<label for="en">Nota (opcional)</label><input id="en" name="note" autocomplete="off" placeholder="Ej: flete Starken, bencina ida a Santiago" value="'+esc(e0?e0.note:'')+'">',
    function(fd){
      var a=parseMoney(fd.get('amount'));if(!(a>0))return 'Escribe el monto del gasto.';
      var e={id:e0?e0.id:uid(),type:fd.get('type'),amount:a,date:fd.get('date')||today(),productId:fd.get('product')||null,purchaseId:fd.get('purchase')||null,note:String(fd.get('note')||'').trim()};
      var pu=e.purchaseId&&purchaseById(e.purchaseId);if(pu)e.date=pu.date;
      if(e0)state.expenses[state.expenses.indexOf(e0)]=e;else state.expenses.push(e);commit();
    });
}

function saleDialog(id){
  var s0=id?state.sales.find(function(x){return x.id===id;}):null;
  var c=calc();
  var items=s0?s0.items.map(function(i){return {productId:i.productId,qty:i.qty,price:i.price};}):[{productId:'',qty:1,price:0}];
  var customers=Array.from(new Set(state.sales.map(function(x){return (x.customer||'').trim();}).filter(Boolean)));
  function avail(pid){var i=c.info[pid];if(!i)return 0;var back=s0?s0.items.filter(function(x){return x.productId===pid;}).reduce(function(a,x){return a+x.qty;},0):0;return i.stock+back;}
  function rows(){return items.map(function(it,k){
    var ph=it.productId&&c.info[it.productId]&&c.info[it.productId].p.photo;
    return '<div class="itemrow" data-k="'+k+'"><div class="sel">'+(ph?'<img class="thumb" src="'+ph+'" alt="">':'')+'<select data-f="productId" aria-label="Producto"><option value="">Elige un producto…</option>'+state.products.map(function(p){return '<option value="'+p.id+'"'+(it.productId===p.id?' selected':'')+'>'+esc(p.name)+' ('+Math.max(c.info[p.id].stock,0)+' en stock)</option>';}).join('')+'</select></div>'+
      '<input data-f="qty" type="number" min="1" inputmode="numeric" aria-label="Cantidad" placeholder="Cant." value="'+(it.qty||'')+'">'+
      '<input data-f="price" inputmode="numeric" aria-label="Precio por unidad" placeholder="Precio c/u" value="'+(it.price||'')+'">'+
      '<button type="button" class="btn sm" data-rm="'+k+'" aria-label="Quitar producto">✕</button></div>';}).join('');}
  var f=openDlg(s0?'Editar venta':'Nueva venta',
    '<label for="sc">Cliente</label><input id="sc" name="customer" list="cl" autocomplete="off" placeholder="Nombre de quien compra" value="'+esc(s0?s0.customer:'')+'"><datalist id="cl">'+customers.map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist>'+
    '<label for="sd">Fecha</label><input id="sd" name="date" type="date" value="'+(s0?s0.date:today())+'">'+
    '<h3>Productos</h3><div id="rows">'+rows()+'</div><button type="button" class="btn sm" id="addit">Agregar otro producto</button>'+
    '<div class="totalline"><span>Total de la venta</span><span id="stot">$0</span></div><p class="warnline" id="swarn" hidden></p>'+
    (s0?'<p class="hint">Los pagos se manejan con «Registrar abono» en la tarjeta de la venta.</p>':
    '<label for="spaid">¿Cuánto pagó ahora?</label><div class="row2"><input id="spaid" name="paid" inputmode="numeric" placeholder="$0 si quedó debiendo"><button type="button" class="btn" id="paidall">Pagó todo</button></div>'),
    function(fd){
      var valid=items.filter(function(i){return i.productId&&i.qty>0;});
      if(!valid.length)return 'Agrega al menos un producto con su cantidad.';
      if(valid.some(function(i){return !(i.price>=0);}))return 'Revisa los precios.';
      var total=valid.reduce(function(a,i){return a+i.qty*i.price;},0);
      var paid=s0?0:parseMoney(fd.get('paid'));
      if(paid>total)return 'El pago no puede ser mayor al total de la venta ('+money(total)+').';
      var sale={id:s0?s0.id:uid(),date:fd.get('date')||today(),customer:String(fd.get('customer')||'').trim(),
        items:valid.map(function(i){return {productId:i.productId,name:c.info[i.productId].p.name,qty:i.qty,price:i.price};}),
        payments:s0?s0.payments:(paid>0?[{id:uid(),date:today(),amount:paid}]:[])};
      if(s0)state.sales[state.sales.indexOf(s0)]=sale;else state.sales.push(sale);commit();
    });
  function upd(){
    var tot=items.reduce(function(a,i){return a+(i.qty||0)*(i.price||0);},0);$('#stot',f).textContent=money(tot);
    var need={},w=[];items.forEach(function(i){if(i.productId)need[i.productId]=(need[i.productId]||0)+(i.qty||0);});
    Object.keys(need).forEach(function(pid){var av=avail(pid);if(need[pid]>av)w.push(esc(c.info[pid].p.name)+': pides '+need[pid]+' y en stock hay '+Math.max(av,0));});
    var el=$('#swarn',f);el.innerHTML=w.join('<br>');el.hidden=!w.length;
  }
  var rowsEl=$('#rows',f);
  rowsEl.addEventListener('input',function(e){
    var row=e.target.closest('.itemrow');if(!row)return;var k=Number(row.dataset.k),fl=e.target.dataset.f;
    if(fl==='qty')items[k].qty=parseInt(e.target.value,10)||0;
    else if(fl==='price')items[k].price=parseMoney(e.target.value);
    else if(fl==='productId'){items[k].productId=e.target.value;var i=c.info[e.target.value];if(i&&i.sell>0)items[k].price=i.sell;rowsEl.innerHTML=rows();}
    upd();
  });
  rowsEl.addEventListener('click',function(e){var b=e.target.closest('[data-rm]');if(!b)return;if(items.length>1)items.splice(Number(b.dataset.rm),1);else items[0]={productId:'',qty:1,price:0};rowsEl.innerHTML=rows();upd();});
  $('#addit',f).onclick=function(){items.push({productId:'',qty:1,price:0});rowsEl.innerHTML=rows();};
  var pa=$('#paidall',f);if(pa)pa.onclick=function(){$('#spaid',f).value=items.reduce(function(a,i){return a+(i.qty||0)*(i.price||0);},0);};
  upd();
}

function payDialog(target){
  var due,label,sale=null,cust=null;
  if(target.sale){sale=state.sales.find(function(s){return s.id===target.sale;});due=saleTotal(sale)-salePaid(sale);label=(sale.customer||'').trim()||'Sin nombre';}
  else{cust=debtors().find(function(d){return d.key===target.cust;});due=cust.due;label=cust.name;}
  openDlg('Registrar abono','<p><strong>'+esc(label)+'</strong> debe '+money(due)+'.</p><label for="pa">Monto que pagó</label><input id="pa" name="amount" inputmode="numeric" value="'+due+'"><label for="pd">Fecha</label><input id="pd" name="date" type="date" value="'+today()+'">',
    function(fd){
      var a=parseMoney(fd.get('amount')),date=fd.get('date')||today();
      if(!(a>0))return 'Escribe el monto del abono.';
      if(a>due)return 'No puede ser más que lo que debe ('+money(due)+').';
      if(sale)sale.payments.push({id:uid(),date:date,amount:a});
      else{var left=a;cust.sales.slice().sort(function(x,y){return x.date.localeCompare(y.date);}).forEach(function(s){
        var d=saleTotal(s)-salePaid(s);if(left<=0||d<=0)return;var x=Math.min(d,left);s.payments.push({id:uid(),date:date,amount:x});left-=x;});}
      commit();toast('Abono registrado');
    },'Registrar');
}

function settingsDialog(){
  var s=state.settings;
  var f=openDlg('Ajustes y respaldo',
    '<label for="sm">% de utilidad general</label><input id="sm" name="markup" inputmode="decimal" value="'+s.markup+'"><p class="hint">Es la ganancia sobre el costo real que se aplica a los productos que no tienen su propio %.</p>'+
    '<label for="sr">Redondear el precio hacia arriba</label><select id="sr" name="round">'+[[1,'Sin redondear'],[100,'A los $100'],[500,'A los $500'],[1000,'A los $1.000']].map(function(o){return '<option value="'+o[0]+'"'+(s.round===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'+
    '<label for="sa">Cómo repartir el despacho y la locomoción</label><select id="sa" name="alloc"><option value="valor"'+(s.alloc==='valor'?' selected':'')+'>Según lo que cuesta cada producto</option><option value="unidad"'+(s.alloc==='unidad'?' selected':'')+'>Igual por cada unidad</option></select>'+
    '<p class="hint">Aplica a los gastos que no asignaste a un producto en particular.</p>'+
    '<h3>Respaldo</h3><p class="hint">'+(state.lastBackup?'Último respaldo: '+fdate(state.lastBackup)+'.':'Aún no has hecho un respaldo.')+'</p>'+
    '<div class="actions"><button type="button" class="btn sm" id="bk">Descargar respaldo</button><button type="button" class="btn sm" id="rs">Restaurar respaldo</button><input type="file" id="rf" accept="application/json,.json" hidden></div>'+
    '<div class="actions"><button type="button" class="btn sm danger" id="wipe">Borrar todos los datos</button></div>',
    function(fd){
      var m=parsePct(fd.get('markup'));if(m===null||m<0)return 'Escribe un % de utilidad válido.';
      state.settings={markup:m,round:Number(fd.get('round')),alloc:fd.get('alloc')};commit();
    });
  $('#bk',f).onclick=exportBackup;
  $('#rs',f).onclick=function(){$('#rf',f).click();};
  $('#rf',f).onchange=function(e){
    var file=e.target.files[0];if(!file)return;var r=new FileReader();
    r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.products)||!Array.isArray(d.sales)||!Array.isArray(d.expenses))throw 0;
      ask('Se reemplazarán todos los datos actuales por los del respaldo.','Restaurar',function(){state=migrate(d);commit();toast('Respaldo restaurado');});}
      catch(x){$('#err').textContent='Ese archivo no es un respaldo válido.';}};
    r.readAsText(file);
  };
  $('#wipe',f).onclick=function(){ask('Se borrarán todos los productos, compras, gastos y ventas. No se puede deshacer. Descarga un respaldo antes si no estás segura.','Borrar todo',function(){state=seed();commit();toast('Datos borrados');});};
}
function exportBackup(){
  try{
    var blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='respaldo-cuentas-navidad-'+today()+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    state.lastBackup=today();save();toast('Respaldo descargado');
  }catch(e){toast('No se pudo descargar el respaldo');}
}

/* ---------- Acciones ---------- */
var ACT={
  tab:function(d){tab=d.v;render();window.scrollTo(0,0);},
  filter:function(d){saleFilter=d.v;render();},
  pview:function(d){prodView=d.v;render();},
  newProduct:function(){productDialog();},
  editProduct:function(d){productDialog(d.id);},
  newSale:function(){if(!state.products.length){toast('Primero agrega un producto');return;}saleDialog();},
  editSale:function(d){saleDialog(d.id);},
  delSale:function(d){ask('Se borrará esta venta y sus pagos.','Borrar',function(){state.sales=state.sales.filter(function(s){return s.id!==d.id;});commit();});},
  pay:function(d){payDialog({sale:d.id});},
  payCust:function(d){payDialog({cust:d.key});},
  delPay:function(d){var s=state.sales.find(function(x){return x.id===d.sale;});s.payments=s.payments.filter(function(p){return p.id!==d.pay;});commit();},
  newPurchase:function(){purchaseDialog();},
  editPurchase:function(d){purchaseDialog(d.id);},
  newExpense:function(){expenseDialog();},
  editExpense:function(d){expenseDialog(d.id);},
  delExpense:function(d){ask('Se borrará este gasto.','Borrar',function(){state.expenses=state.expenses.filter(function(e){return e.id!==d.id;});commit();});},
  settings:function(){settingsDialog();},
  remind:function(d){
    var x=debtors().find(function(y){return y.key===d.key;});
    var names=Array.from(new Set([].concat.apply([],x.sales.filter(function(s){return saleTotal(s)-salePaid(s)>0;}).map(function(s){return s.items.map(function(i){return i.name;});}))));
    var msg='Hola '+x.name+', te escribo para recordarte el saldo pendiente de '+money(x.due)+' por tu compra ('+names.join(', ')+'). ¡Muchas gracias!';
    var fallback=function(){openDlg('Mensaje de cobro','<textarea id="rm" readonly>'+esc(msg)+'</textarea><p class="hint">Mantén presionado el texto para copiarlo.</p>',function(){},'Listo');setTimeout(function(){var t=$('#rm');if(t)t.select();},50);};
    try{navigator.clipboard.writeText(msg).then(function(){toast('Mensaje copiado. Pégalo en WhatsApp');},fallback);}catch(e){fallback();}
  }
};
document.addEventListener('click',function(e){
  if(e.target===dlg){dlg.close();return;}
  if(e.target.closest('[data-close]')){dlg.close();return;}
  var t=e.target.closest('[data-a]');if(t&&ACT[t.dataset.a])ACT[t.dataset.a](t.dataset);
});
render();
})();
</script>
</body>
</html>
